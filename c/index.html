<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bowler</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:48px 24px;text-align:center;color:#222}
h1{font-size:28px;margin:0 0 8px}p{color:#666;max-width:420px;margin:12px auto}code{background:#f2f2f2;padding:2px 6px;border-radius:4px}</style></head>
<body><h1>Bowler</h1>
<p>This label belongs to a Bowler home inventory. Open it on a device with the Bowler app installed, or ask the owner where this box lives.</p>
<p id="tag"></p>
<script>const m=location.pathname.match(/\/(t|c|i)\/([^/]+)/);if(m){document.getElementById('tag').innerHTML='Tag <code>'+decodeURIComponent(m[2])+'</code>'}</script>
</body></html>
